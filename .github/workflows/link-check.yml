name: Public link check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relative-links:
    name: Check active relative links
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run strict relative-link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline
            --no-progress
            --root-dir "${{ github.workspace }}"
            --exclude-path '^archive/'
            './**/*.md'
          fail: true
  external-links:
    name: Report external HTTP findings
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run advisory external-link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --root-dir "${{ github.workspace }}"
            --scheme http
            --scheme https
            --exclude-path '^archive/'
            --max-concurrency 16
            --max-retries 2
            './**/*.md'
          format: markdown
          jobSummary: true
          fail: false